<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>متابعة إنجاز الفرق</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style id="app-css">
/* Layout: phone-first. Compact top bar, stat tiles, foldable setup, ranking, team cards; actions sit in a bottom bar on phones and in the top bar on wide screens. */
:root{
  --bg:#F6F7FC; --surface:#FFFFFF; --surface-2:#F3F5FB; --ink:#1E2433; --muted:#636C80; --faint:#9AA2B4; --line:#E7EAF3;
  --accent:#5566E8; --accent-text:#4454D8; --accent-ink:#FFFFFF; --accent-soft:#EEF0FE; --accent-line:#D3D8FB; --tint:#EAF4FF;
  --good:#1C9466; --good-soft:#E4F7EF; --good-line:#BFEAD7;
  --mid:#C27D0E; --mid-soft:#FFF3E0; --mid-line:#F8DDB0;
  --low:#D04B42; --low-soft:#FDECEB; --low-line:#F6CBC7;
  --track:#ECEEF5; --star:#F2B01E; --sky:#EAF4FF; --rose:#FDF0F5; --mint:#EAF8F2; --peach:#FFF5E9;
  --shadow:0 1px 2px rgba(40,50,90,.04),0 6px 20px rgba(40,50,90,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r-bg:#FFFFFF; --r-ink:#1E2433; --r-muted:#636C80; --r-line:#E7EAF3; --r-head:#F3F5FB; --r-accent:#5566E8; --r-track:#ECEEF5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141C; --surface:#191D28; --surface-2:#202532; --ink:#EBEEF6; --muted:#A3ABBE; --faint:#717A8F; --line:#2A3040;
  --accent:#95A1FF; --accent-text:#A5AFFF; --accent-ink:#11141C; --accent-soft:#252B4A; --accent-line:#3C4580; --tint:#1C2638;
  --good:#5BD39C; --good-soft:#163428; --good-line:#245540; --mid:#F0BA58; --mid-soft:#3A2E16; --mid-line:#5A4720;
  --low:#F48C84; --low-soft:#3E2021; --low-line:#613234;
  --track:#2A3040; --star:#F5C451; --sky:#1C2638; --rose:#2E1F28; --mint:#18291F; --peach:#2E2618;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#191D28; --surface-2:#202532; --ink:#EBEEF6; --muted:#A3ABBE; --faint:#717A8F; --line:#2A3040;
  --accent:#95A1FF; --accent-text:#A5AFFF; --accent-ink:#11141C; --accent-soft:#252B4A; --accent-line:#3C4580; --tint:#1C2638;
  --good:#5BD39C; --good-soft:#163428; --good-line:#245540; --mid:#F0BA58; --mid-soft:#3A2E16; --mid-line:#5A4720;
  --low:#F48C84; --low-soft:#3E2021; --low-line:#613234;
  --track:#2A3040; --star:#F5C451; --sky:#1C2638; --rose:#2E1F28; --mint:#18291F; --peach:#2E2618;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),var(--tint));color:var(--accent-text);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.title-box{flex:1;min-width:0;display:flex;flex-direction:column}
.title-box input.title-in{font-family:var(--f-display);font-size:1.08rem;font-weight:700;border:0;background:transparent;color:var(--ink);padding:1px 4px;margin-inline-start:-4px;width:100%;border-radius:6px;text-overflow:ellipsis}
.title-box input.title-in:hover,.title-box input.title-in:focus{box-shadow:none;border:0;background:var(--surface-2);outline:none}
.save-state{font-size:.75rem;color:var(--faint);display:flex;align-items:center;gap:6px}
.save-state .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.save-state.dirty .dot{background:var(--mid)}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--accent-text);border-color:var(--accent-line);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--low);border-color:var(--low-line);background:var(--low-soft)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}

/* theme menu */
.theme-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:170px;display:flex;flex-direction:column;gap:2px;z-index:12}
.menu button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;text-align:start;color:var(--ink)}
.menu button:hover{background:var(--surface-2)}
.menu button[aria-checked=true]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}

.wrap{max-width:1080px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* stats */
.stats{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:10px}
.stat{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid var(--line);background:var(--surface)}
.stat .k{font-size:.8rem;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat.t1{background:var(--sky);border-color:transparent}
.stat.t2{background:var(--rose);border-color:transparent}
.stat.t3{background:var(--mint);border-color:transparent}
.stat.hero{background:linear-gradient(135deg,var(--accent-soft),var(--tint));border-color:var(--accent-line);flex-direction:row;align-items:center;gap:14px}
.stat.hero .v{color:var(--accent-text);font-size:2rem}
.stat.hero .ring{width:64px;height:64px}
.example{display:flex;align-items:center;gap:8px;font-size:.84rem;background:var(--peach);color:var(--mid);padding:10px 14px;border-radius:14px;font-weight:500;border:1px solid var(--mid-line)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.panel>summary,.panel-head{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;min-height:56px;cursor:pointer}
.panel>summary::-webkit-details-marker{display:none}
.panel-head{cursor:default;flex-wrap:wrap}
.panel h2{font-size:1rem;display:flex;align-items:center;gap:10px}
.panel h2 .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.panel h2 .ic svg{width:18px;height:18px}
.panel .chev{transition:transform .2s;color:var(--faint)}
.panel[open] .chev{transform:rotate(180deg)}
.panel-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
.setup{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:22px}
.setup>div{min-width:0}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1 1 auto;width:100%}
.add-row .btn{flex:none}
.field-label{font-size:.84rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

:where(input[type=text],input[type=number],textarea){font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}

:where(input[type=text],input[type=number],textarea):focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.stepper button{width:46px;height:46px;border:0;background:transparent;font-size:1.3rem;color:var(--accent-text)}
.stepper button:hover{background:var(--accent-soft)}
.stepper input{width:58px;text-align:center;border:0!important;border-radius:0;background:transparent!important;box-shadow:none!important;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:8px 0}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:99px;padding:2px 2px 2px 4px}
.chip{max-width:100%}
.chip input{background:transparent!important;border:0!important;box-shadow:none!important;padding:6px 10px;width:auto;max-width:min(180px,60vw);field-sizing:content;min-width:3ch;font-size:15px;font-weight:500;color:var(--ink)}
.chip button{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:var(--low-soft);color:var(--low)}
.chip button svg{width:15px;height:15px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;background:var(--low-soft);border:1px solid var(--low-line);border-radius:14px;padding:10px 12px}
.confirm .txt{flex:1 1 180px}
.hint{font-size:.8rem;color:var(--faint)}

/* ranking */
.board{display:flex;flex-direction:column;gap:4px;padding:0 10px 12px}
.brow{display:grid;grid-template-columns:30px minmax(0,9rem) 1fr 50px;gap:12px;align-items:center;font-variant-numeric:tabular-nums;padding:8px 6px;border-radius:12px}
.rank{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.rank.r1{background:#FFF1C7;color:#9A6A00}.rank.r2{background:#EDEFF5;color:#5C667A}.rank.r3{background:#FBE6D7;color:#9A5420}
:root[data-theme="dark"] .rank.r1,:root[data-theme="dark"] .rank.r2,:root[data-theme="dark"] .rank.r3{background:var(--accent-soft);color:var(--accent-text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rank.r1,:root:not([data-theme="light"]) .rank.r2,:root:not([data-theme="light"]) .rank.r3{background:var(--accent-soft);color:var(--accent-text)}}
.bname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;transition:width .4s}
.pct{font-weight:700;text-align:left;direction:ltr}

/* view toolbar */
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}
.vbar h2{font-size:1.1rem}
.seg-sw{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.seg-sw button{border:0;background:transparent;min-height:38px;padding:0 14px;border-radius:9px;font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg-sw button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.seg-sw svg.i{width:17px;height:17px}

/* team cards */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px;align-items:start}
.team{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.team-head{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 8px;cursor:pointer}
.team-head .name{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.team-head input.tname{font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:transparent;border:1px solid transparent;padding:3px 6px;margin-inline-start:-7px;border-radius:8px;cursor:text}
.team-head input.tname:hover,.team-head input.tname:focus{background:var(--surface-2);outline:none;box-shadow:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pill{font-size:.76rem;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500}
.pill.star{background:var(--peach);color:var(--mid)}
.ring{flex:none;width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{transition:stroke-dasharray .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:.88rem;font-variant-numeric:tabular-nums;direction:ltr}
.team-tools{display:flex;gap:0}
.team-tools .icon-btn{width:40px;height:40px;border:0;background:transparent}
.collapse-ic{transition:transform .2s}
.team[data-collapsed="1"] .team-body{display:none}
.team[data-collapsed="1"] .collapse-ic{transform:rotate(180deg)}
.team-body{border-top:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.sec-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-name{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px;min-width:0}
.sec-name .dot{width:9px;height:9px;border-radius:50%;flex:none}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;direction:ltr}
.seg button{border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);min-height:40px;font-size:.86rem;font-weight:500;font-variant-numeric:tabular-nums}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed=true]{font-weight:700;box-shadow:0 1px 3px rgba(40,50,90,.08)}
.seg button[aria-pressed=true][data-lv=zero]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.seg button[aria-pressed=true][data-lv=low]{background:var(--low-soft);color:var(--low);border-color:var(--low-line)}
.seg button[aria-pressed=true][data-lv=mid]{background:var(--mid-soft);color:var(--mid);border-color:var(--mid-line)}
.seg button[aria-pressed=true][data-lv=good]{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.sec-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{display:flex;direction:ltr;margin-inline-start:-6px}
.stars button{border:0;background:transparent;width:38px;height:38px;color:var(--track);display:grid;place-items:center;border-radius:10px}
.stars button svg{width:24px;height:24px;fill:currentColor;stroke:none;transition:transform .15s}
.stars button.on{color:var(--star)}
.stars button:active svg{transform:scale(1.25)}
.note-btn{border:0;background:transparent;color:var(--accent-text);font-size:.85rem;font-weight:500;min-height:38px;padding:0 8px;border-radius:10px;display:flex;align-items:center;gap:4px}
.note-btn:hover{background:var(--accent-soft)}
.note-btn svg{width:16px;height:16px}
.note{width:100%;font-size:15px!important;padding:8px 12px!important}
.team-foot{padding:12px 14px 14px;background:var(--surface-2)}
.team-foot textarea{width:100%;resize:vertical;min-height:48px;background:var(--surface)}

/* status + notes */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg3 button{border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);min-height:42px;font-size:.9rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.seg3 button:hover{background:var(--surface)}
.seg3 button .d{width:8px;height:8px;border-radius:50%;background:var(--track)}
.seg3 button[aria-pressed=true]{font-weight:700;box-shadow:0 1px 3px rgba(40,50,90,.08)}
.seg3 button[aria-pressed=true][data-lv=zero]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.seg3 button[aria-pressed=true][data-lv=mid]{background:var(--mid-soft);color:var(--mid);border-color:var(--mid-line)}
.seg3 button[aria-pressed=true][data-lv=good]{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.seg3 button[aria-pressed=true] .d{background:currentColor}
textarea.note{width:100%;resize:vertical;min-height:46px;font-size:15px;line-height:1.5;padding:9px 12px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px}
.badge[data-lv=zero]{background:var(--surface-2);color:var(--muted)}
.badge[data-lv=mid]{background:var(--mid-soft);color:var(--mid)}
.badge[data-lv=good]{background:var(--good-soft);color:var(--good)}
.prog-dots{display:flex;gap:4px;flex-wrap:wrap}
.prog-dots i{width:10px;height:10px;border-radius:3px;background:var(--track)}
.prog-dots i[data-lv=mid]{background:var(--mid)}
.prog-dots i[data-lv=good]{background:var(--good)}

/* team overall percentage */
.pct-field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:linear-gradient(135deg,var(--accent-soft),var(--tint));border-bottom:1px solid var(--line)}
.pct-field label{font-weight:600;font-size:.92rem}
.pct-field .hint{display:block;font-weight:400}
.pct-in{display:flex;align-items:center;background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;padding-inline-end:12px;direction:ltr}
.pct-in input{width:72px;border:0!important;background:transparent!important;box-shadow:none!important;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--accent-text);-moz-appearance:textfield;padding:8px 4px}
.pct-in input::-webkit-inner-spin-button{-webkit-appearance:none}
.pct-in span{color:var(--muted);font-weight:600}
.pct-in.sm input{width:54px;font-size:1rem;padding:6px 2px}

/* page tabs */
.tabs-in{max-width:1080px;margin:0 auto;display:flex;gap:6px;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in button{flex:1;max-width:220px;min-height:42px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.tabs-in button[aria-current=page]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs-in button .cnt{font-size:.75rem;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,currentColor 15%,transparent)}
@media (max-width:600px){.tabs-in button{max-width:none}}

/* roster page */

async function save(){
  if(!artifactNS)return;document.querySelectorAll('[data-act="save"]').forEach(b=>b.disabled=true);

  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:next.ts,state:next,dirty:false}))}catch(e){}
  try{await artifactNS.publish(buildDoc(next))}
  catch(err){
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:embedded.ts,state:S,dirty:true}))}catch(e){}

}

  const totM=S.teams.reduce((a,t)=>a+(t.members||[]).filter(x=>x.trim()).length,0);

  h+=`<div><div class="kpis"><div class="kpi main"><div class="k">عدد الفرق</div><div class="v">${N(S.teams.length)}</div></div><div class="kpi"><div class="k">إجمالي الأعضاء</div><div class="v">${N(totM)}</div></div><div class="kpi"><div class="k">متوسط الإنجاز</div><div class="v">${N(overall()+"%")}</div></div></div></div>`;
  h+=`<div><h2 class="sec-title" style="margin-bottom:10px">ملخص الفرق</h2><table><colgroup><col style="width:10%"><col style="width:34%"><col style="width:18%"><col style="width:38%"></colgroup><thead><tr><th class="c">#</th><th>الفريق</th><th class="c">عدد الأعضاء</th><th>نسبة الإنجاز</th></tr></thead><tbody>${S.teams.map((t,i)=>{const p=teamPct(t),n=(t.members||[]).filter(x=>x.trim()).length;return `<tr><td class="c"><span class="rank">${i+1}</span></td><td class="ell" style="font-weight:700">${esc(t.name)}</td><td class="c">${N(n)}</td><td><div style="display:flex;align-items:center;gap:10px"><div class="rbar"><i style="width:${p}%;background:${rc(p)}"></i></div><b style="width:42px;flex:none;color:${rc(p)}">${N(p+"%")}</b></div></td></tr>`}).join("")}</tbody></table></div>`;
  h+=`<div><h2 class="sec-title">أعضاء الفرق</h2></div>`;
  S.teams.forEach((t,i)=>{const p=teamPct(t),m=(t.members||[]).filter(x=>x.trim());
    h+=`<div><div class="tcard"><div class="thead">${rring(p,62,rc(p))}<div class="nm"><h3>${esc(t.name)}</h3><div class="mini"><span>الفريق ${N(i+1)} من ${N(S.teams.length)}</span><span>عدد الأعضاء ${N(m.length)}</span></div></div></div>
    <div class="tbody">${m.length?`<div class="mgrid">${m.map((nm,k)=>`<div class="mcell"><span class="mnum">${k+1}</span><span class="ell">${esc(nm)}</span></div>`).join("")}</div>`:`<div style="color:#9AA2B4;padding:12px 0">لم تُضف أسماء لهذا الفريق.</div>`}</div></div></div>`});
  rep.innerHTML=h;
  const foot=document.createElement("div");foot.innerHTML=`<div class="foot"><span>الفرق · ${esc(S.title)}</span><span>${N(today())}</span></div>`;
  return {rep,foot};
}
function buildPrintReport(){const {rep,foot}=UI.page==="teams"?buildTeamsReport():buildReport();rep.appendChild(foot)}
window.addEventListener("beforeprint",buildPrintReport);
async function exportPdf(btn){
  if(useNativePrint){buildPrintReport();window.print();toast("لحفظه PDF اختر ذلك من شاشة الطباعة.");return}
  if(!downloadsNS){toast("تنزيل الملفات غير متاح في هذا العرض.");return}
  if(!window.html2canvas||!window.jspdf){toast("لم تُحمَّل أدوات PDF. أعد فتح الصفحة.");return}
  const btns=document.querySelectorAll('[data-act="pdf"]');btns.forEach(b=>{b.disabled=true});const old=btn.innerHTML;btn.textContent="جارٍ التجهيز…";
  const rep=document.getElementById("report");
  try{
    await document.fonts.ready;
    const isTeams=UI.page==="teams";const {foot}=isTeams?buildTeamsReport():buildReport();
    const blocks=[...rep.children];rep.appendChild(foot);
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),M=34,UW=W-2*M,FOOT=30;
    const fc=await html2canvas(foot,{scale:2,backgroundColor:"#ffffff",logging:false});const fh=fc.height*UW/fc.width;const fimg=fc.toDataURL("image/png");
    let y=M,first=true;
    for(const blk of blocks){
      const cv=await html2canvas(blk,{scale:2,backgroundColor:"#ffffff",logging:false});
      let h=cv.height*UW/cv.width,w=UW;
      const room=H-M-FOOT;
      if(h>room-M){w=UW*(room-M)/h;h=room-M}
      if(!first&&y+h>room){pdf.addPage();y=M}
      pdf.addImage(cv.toDataURL("image/jpeg",0.94),"JPEG",M+(UW-w)/2,y,w,h);y+=h;first=false;
    }
    const n=pdf.getNumberOfPages();
    for(let i=1;i<=n;i++){pdf.setPage(i);pdf.addImage(fimg,"PNG",M,H-M+4-fh,UW,fh);pdf.setFontSize(9);pdf.setTextColor(154,162,180);pdf.text(i+" / "+n,W/2,H-M+4-fh/2+3,{align:"center"})}
    const name=(isTeams?"الفرق ":"متابعة ")+today().replace(/\//g,"-")+".pdf";
    rep.innerHTML="";
    await downloadsNS.save({filename:name,data:pdf.output("blob")});
    toast("تم حفظ ملف PDF");
  }catch(err){
    rep.innerHTML="";
    const c=err&&err.code;
    if(c==="declined"){}else if(c==="rate_limited")toast("هناك نافذة حفظ مفتوحة بالفعل.");
    else if(c==="unavailable"||c==="not_granted")toast("تنزيل الملفات غير متاح في هذا العرض.");
    else toast("تعذّر إنشاء الملف. حاول مرة أخرى.");
  }finally{btns.forEach(b=>{b.disabled=false});btn.innerHTML=old}
}

/* ---------- print method: WebKit breaks Arabic in html2canvas, so it uses the browser's own print ---------- */
const useNativePrint=(()=>{
  const q=new URLSearchParams(location.search).get("print");
  if(q==="native")return true;if(q==="canvas")return false;
  const ua=navigator.userAgent;
  const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  return ios||(/Safari\//.test(ua)&&!/Chrome|Chromium|Edg|OPR|Android/.test(ua));
})();
if(useNativePrint&&document.fonts){['500 13px "IBM Plex Sans Arabic"','600 13px "IBM Plex Sans Arabic"','700 13px "IBM Plex Sans Arabic"','700 17px "Readex Pro"'].forEach(f=>{document.fonts.load(f,"ع").catch(()=>{})})}

/* ---------- Cloud sync via Supabase RPC. Empty URL/key = local-only. The key is the public publishable one; tracker_get/tracker_save check the access code on the server. ---------- */
const SUPABASE_URL="https://bvgjalodboilkqusuegu.supabase.co",SUPABASE_KEY="sb_publishable_-1uWRNFs23fMgWYZT2eG-g_xE0b2HVT";
const CLOUD_KEY="team-tracker-cloud",CODE_KEY="team-tracker-code";
const cloudEnabled=!!(SUPABASE_URL&&SUPABASE_KEY);
const cloud={code:null,version:null,synced:false,pending:false,pushing:false,again:false,offline:false,conflict:null,timer:null,retry:null};
let loginOpen=false;
const embeddedSrc=document.getElementById("state").textContent;

async function rpc(fn,args){
  const body=JSON.stringify(args);
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body,keepalive:body.length<60000});
  if(!r.ok)throw new Error("rpc "+r.status);
  return r.json();
}
function readCloudCache(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||"null")}catch(e){return null}}
function writeCloudCache(){if(!cloud.code)return;try{localStorage.setItem(CLOUD_KEY,JSON.stringify({version:cloud.version,pending:cloud.pending,state:S}))}catch(e){}}
function writeDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:embedded.ts,state:S,dirty}))}catch(e){}}
function validState(s){return !!s&&Array.isArray(s.teams)&&Array.isArray(s.sections)}
function normalizeState(s){s.teams.forEach(t=>{for(const k in t.r){const c=t.r[k];c.p=c.p>=100?100:c.p>0?50:0}});return s}
/* Sorted keys: Postgres jsonb does not keep key order. */
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,n)=>(o[n]=x[n],o),{}):x);
function sameData(a,b){return canon(a)===canon(b)}
function cloudTouch(){
  if(!cloud.code)return;
  cloud.pending=true;writeCloudCache();
  clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1200);
}
function cloudRetryLater(){cloud.offline=true;clearTimeout(cloud.retry);cloud.retry=setTimeout(cloudResume,20000)}
function cloudResume(){if(!cloud.code)return;if(cloud.pending&&cloud.synced)cloudPush();else cloudSync()}
function adoptRemote(row){
  const changed=!sameData(S,row.state);
  S=normalizeState(row.state);cloud.version=row.version;cloud.pending=false;cloud.conflict=null;cloud.synced=true;dirty=false;
  writeDraft();writeCloudCache();applyAccent();
  if(changed)rerender();else updateSaveUI();
}
function startConflict(row){cloud.conflict=row;cloud.synced=true;rerender()}
/* The code stopped working (it was changed): ask for the new one. Unsaved edits stay on this device. */
function cloudRejected(reason){
  if(reason==="locked"){cloudRetryLater();updateSaveUI();return}
  try{localStorage.removeItem(CODE_KEY)}catch(e){}
  clearTimeout(cloud.timer);clearTimeout(cloud.retry);
  cloud.code=null;cloud.synced=false;cloud.offline=false;cloud.version=null;cloud.conflict=null;
  loginOpen=true;rerender();toast("الرمز تغيّر، أدخل الرمز الجديد.");
}
function cloudApply(res){
  cloud.offline=false;clearTimeout(cloud.retry);
  const data=res.state?res:null;
  const c=readCloudCache(),mine=c&&validState(c.state)?c:null;
  if(data&&!validState(data.state)){toast("بيانات السحابة غير صالحة، لم تُستبدل بياناتك.");return}
  /* dirty covers edits typed before the code was entered; cloud.pending covers edits typed during this fetch. */
  if(!cloud.pending&&!dirty&&mine&&mine.pending){S=normalizeState(mine.state);applyAccent()}
  const pending=cloud.pending||dirty||!!(mine&&mine.pending);
  if(!data){cloud.version=res.version;cloud.pending=true;cloud.synced=true;writeCloudCache();rerender();cloudPush();return}
  if(mine){
    if(!pending){adoptRemote(data);return}
    if(data.version===mine.version){cloud.version=data.version;cloud.pending=true;cloud.synced=true;rerender();cloudPush();return}
    cloud.pending=true;startConflict(data);return;
  }
  /* First time on this device: never silently drop data typed here before syncing. */
  if(pending&&!sameData(S.teams,data.state.teams)){cloud.pending=true;startConflict(data);return}
  adoptRemote(data);
}
async function cloudSync(){
  if(!cloud.code||cloud.conflict)return;
  const code=cloud.code;
  let res;
  try{res=await rpc("tracker_get",{p_code:code})}catch(e){cloudRetryLater();updateSaveUI();return}
  if(cloud.code!==code)return;
  if(!res.ok){cloudRejected(res.reason);return}
  cloudApply(res);
}
async function cloudPush(){
  if(!cloud.code||cloud.conflict||!cloud.pending||!cloud.synced)return;
  if(cloud.pushing){cloud.again=true;return}
  clearTimeout(cloud.timer);
  cloud.pushing=true;cloud.again=false;updateSaveUI();
  const snap=JSON.stringify(S);
  try{
    const res=await rpc("tracker_save",{p_code:cloud.code,p_state:JSON.parse(snap),p_version:cloud.version});
    if(!res.ok){cloudRejected(res.reason);return}
    cloud.offline=false;clearTimeout(cloud.retry);
    /* Another device saved first: let the user choose. */
    if(!res.saved){
      if(validState(res.state))startConflict(res);
      else{cloud.version=res.version;cloud.again=true}
      return;
    }
    cloud.version=res.version;
    cloud.pending=JSON.stringify(S)!==snap;
    if(!cloud.pending)dirty=false;
    writeDraft();writeCloudCache();
  }catch(e){cloudRetryLater()}
  finally{
    cloud.pushing=false;updateSaveUI();
    if(cloud.again&&cloud.pending&&!cloud.conflict&&!cloud.offline)cloudPush();
  }
}
function cloudUseRemote(){const r=cloud.conflict;if(!r)return;adoptRemote(r);rerender();toast("تم استخدام نسخة السحابة")}
function cloudKeepLocal(){const r=cloud.conflict;if(!r)return;cloud.version=r.version;cloud.conflict=null;cloud.pending=true;rerender();cloudPush()}
function conflictBanner(){
  if(!cloud.conflict)return "";
  const d=cloud.conflict.updated_at?new Date(cloud.conflict.updated_at):null;
  const when=d&&!isNaN(d)?` (آخر حفظ ${d.toLocaleString("ar")})`:"";
  return `<div class="example conflict" role="alert">${I.info}<span>توجد نسخة مختلفة في السحابة${esc(when)}. أي نسخة تريد الإبقاء عليها؟ النسخة الأخرى ستُستبدل.</span><button class="btn sm soft" id="useRemote">نسخة السحابة</button><button class="btn sm ghost" id="keepLocal">نسخة هذا الجهاز</button></div>`;
}
function loginSheet(){
  const head=`<div class="backdrop" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><div class="grab"></div><div class="sheet-head"><h3 id="loginTitle">الحفظ السحابي</h3><button class="icon-btn" data-close="1" aria-label="إغلاق">${I.x}</button></div>`;
  if(cloud.code)return head+`<div class="cloud-acct">هذا الجهاز متصل بالحفظ السحابي.</div><button class="btn ghost" id="cloudOut">إزالة الرمز من هذا الجهاز</button><button class="btn primary" data-close="1">تم</button></div>`;
  return head+`<div class="hint">اكتب الرمز مرة واحدة على هذا الجهاز لتظهر بياناتك نفسها على كل أجهزتك.</div>
    <form class="login-form" id="loginForm">
      <div><label class="field-label" for="loginCode">الرمز</label><input id="loginCode" name="code" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
      <div class="login-err" id="loginErr" role="alert"></div>
      <button class="btn primary" type="submit" id="loginBtn">متابعة</button>
    </form></div>`;
}
async function cloudSignIn(form){
  const err=document.getElementById("loginErr"),btn=document.getElementById("loginBtn"),code=form.elements.code.value.trim();
  err.textContent="";if(!code)return;btn.disabled=true;
  try{
    const res=await rpc("tracker_get",{p_code:code});
    if(!res.ok){err.textContent=res.reason==="locked"?"محاولات خاطئة كثيرة. انتظر 5 دقائق ثم حاول مرة أخرى.":"الرمز غير صحيح.";btn.disabled=false;return}
    cloud.code=code;cloud.pending=false;cloud.version=null;cloud.synced=false;
    try{localStorage.setItem(CODE_KEY,code)}catch(e){}
    loginOpen=false;rerender();cloudApply(res);
  }catch(e){err.textContent="تعذّر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.";btn.disabled=false}
}
async function cloudSignOut(){
  if(cloud.pending)await cloudPush();
  if(cloud.pending){toast("لم تُرفع كل التعديلات بعد، لذلك لم يُزَل الرمز.");return}
  clearTimeout(cloud.retry);clearTimeout(cloud.timer);
  cloud.code=null;cloud.version=null;cloud.synced=false;cloud.offline=false;
  /* Leave no team data behind on this device. */
  try{localStorage.removeItem(CODE_KEY);localStorage.removeItem(CLOUD_KEY);localStorage.removeItem(DRAFT_KEY)}catch(e){}
  S=normalizeState(JSON.parse(embeddedSrc));dirty=false;applyAccent();rerender();
}
if(cloudEnabled){
  try{cloud.code=localStorage.getItem(CODE_KEY)}catch(e){}
  if(cloud.code)setTimeout(cloudSync,0);else loginOpen=true;
  document.addEventListener("visibilitychange",()=>{
    if(!cloud.code)return;
    if(document.visibilityState==="hidden"){if(cloud.pending)cloudPush();return}
    if(cloud.pending){cloudResume();return}
    const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))return;
    cloudSync();
  });
  window.addEventListener("online",cloudResume);
  window.addEventListener("pagehide",()=>{if(cloud.code&&cloud.pending)cloudPush()});
}

render();
let lastPhone=isPhone();window.addEventListener("resize",()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;rerender()}});
if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(a=>{artifactNS=a;rerender()}).catch(()=>{});
  window.claude.use("downloads").then(d=>{downloadsNS=d;rerender()}).catch(()=>{});
}else{
  downloadsNS={save:({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return Promise.resolve({status:"saved"})}};
  rerender();
}
})();
